<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端數位電子紙氣壓計 (84小時)</title>
  
  <!-- 1. 引入 Chart.js 畫圖庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- 2. 引入 Firebase v9 兼容版 SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #eef2f5;
      font-family: 'Courier New', Courier, monospace, system-ui;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }
    
    /* 模仿 Steamrock SB-42 復古電子紙卡片風格 */
    .barometer-card {
      width: 100%;
      max-width: 450px;
      background: #fcfcf9;
      border: 3px solid #1a1a1a;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 6px 6px 0px #1a1a1a;
      color: #1a1a1a;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #1a1a1a;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .header h1 { font-size: 1.2rem; margin: 0; letter-spacing: 1.5px; }
    .station-name {
      font-weight: bold;
      font-size: 0.85rem;
      background: #1a1a1a;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
    }

    .main-metrics {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .pressure-value { font-size: 2.8rem; font-weight: 800; line-height: 1; }
    .unit { font-size: 1.1rem; font-weight: normal; }

    .trend-badge {
      text-align: right;
      font-size: 0.9rem;
      font-weight: bold;
      background: #f0f0eb;
      padding: 8px 12px;
      border: 1.5px solid #1a1a1a;
      border-radius: 6px;
    }

    /* 氣壓急降警告橫幅 */
    .warning-banner {
      display: none;
      background: #1a1a1a;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 15px;
      text-align: center;
    }

    /* 圖表容器 */
    .chart-container {
      position: relative;
      width: 100%;
      height: 220px;
      border: 1.5px solid #1a1a1a;
      border-radius: 6px;
      padding: 8px;
      background: #fff;
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="barometer-card">
  <div class="header">
    <h1>BAROMETER</h1>
    <span class="station-name">雲端 84H 同步</span>
  </div>

  <div class="main-metrics">
    <div class="pressure-value">
      <span id="curr-p">---.-</span> <span class="unit">hPa</span>
    </div>
    <div class="trend-badge">
      <div>3h 變率</div>
      <div id="trend-3h" style="font-size: 1.2rem;">--- hPa</div>
    </div>
  </div>

  <div id="warning-banner" class="warning-banner">
    ⚠️ 警告：3小時內氣壓驟降！防範強風/雷暴
  </div>

  <div class="chart-container">
    <canvas id="pressureChart"></canvas>
  </div>

  <div class="footer-note" id="status-note">
    正在從 Firebase 載入雲端數據...
  </div>
</div>

<script>
  // ==========================================
  // 📍 1. 貼上你的 Firebase 配置
  // ==========================================
  const firebaseConfig = {
  apiKey: "AIzaSyDQcBiD_v-ka5fGwU_8aEDgI6DF5rj1Lmo",
  authDomain: "hko-barometer.firebaseapp.com",
  projectId: "hko-barometer",
  storageBucket: "hko-barometer.firebasestorage.app",
  messagingSenderId: "473068559882",
  appId: "1:473068559882:web:1c8096e98ad2b4ccd4c9f3",
  measurementId: "G-7B9VNBW9K6"
  };

  // 初始化 Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // ==========================================
  // 📍 2. 初始化 Chart.js 復古電子紙風格圖表
  // ==========================================
  const ctx = document.getElementById('pressureChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: '海平面氣壓 (hPa)',
        data: [],
        borderColor: '#1a1a1a',
        borderWidth: 2,
        pointRadius: 1,
        pointBackgroundColor: '#1a1a1a',
        fill: false,
        tension: 0.1
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: {
          display: true,
          ticks: { maxTicksLimit: 6, font: { family: 'Courier New', size: 10 } },
          grid: { display: false }
        },
        y: {
          display: true,
          ticks: { font: { family: 'Courier New', size: 10 } },
          grid: { color: '#e5e5e0' }
        }
      }
    }
  });

  // ==========================================
  // 📍 3. 從 Firebase 查詢 84 小時內的數據
  // ==========================================
  async function loadFirebaseData() {
    try {
      // 計算 84 小時 (3.5 天) 前的時間戳記
      const eightyFourHoursAgo = Date.now() - (84 * 60 * 60 * 1000);

      // 查詢資料庫：只拉取 84 小時內的紀錄，並按時間順序排列
      const snapshot = await db.collection('barometer_history')
        .where('timestamp', '>=', eightyFourHoursAgo)
        .orderBy('timestamp', 'asc')
        .get();

      const labels = [];
      const values = [];
      let latestPressure = 0;

      snapshot.forEach(doc => {
        const data = doc.data();
        labels.push(data.timeStr);
        values.push(data.pressure);
        latestPressure = data.pressure;
      });

      if (values.length > 0) {
        // 更新當前氣壓
        document.getElementById('curr-p').innerText = latestPressure.toFixed(1);

        // 計算 3 小時變率 (大約是 12 筆資料前，假設每15分鐘一筆)
        const sampleGap = Math.min(12, values.length - 1);
        const p3hAgo = values[values.length - 1 - sampleGap];
        const diff = (latestPressure - p3hAgo).toFixed(1);
        
        const sign = diff > 0 ? "+" : "";
        document.getElementById('trend-3h').innerText = `${sign}${diff} hPa`;

        // 急降警告邏輯 (3小時內下降 >= 2.0 hPa)
        if (diff <= -2.0) {
          document.getElementById('warning-banner').style.display = 'block';
        } else {
          document.getElementById('warning-banner').style.display = 'none';
        }

        // 更新 Chart.js 圖表
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();

        document.getElementById('status-note').innerText = `數據即時同步中 (已累積 ${values.length} 筆紀錄)`;
      } else {
        document.getElementById('status-note').innerText = "資料庫暫無 84 小時內的數據，請等待機器人擷取...";
      }

    } catch (err) {
      console.error("載入 Firebase 數據失敗:", err);
      document.getElementById('status-note').innerText = "連線資料庫失敗，請檢查 Config 配置或 Firestore 規則。";
    }
  }

  // 網頁開啟時自動載入，並每 5 分鐘自動刷新一次
  loadFirebaseData();
  setInterval(loadFirebaseData, 5 * 60 * 1000);
</script>

</body>
</html>
