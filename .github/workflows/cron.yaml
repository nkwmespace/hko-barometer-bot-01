name: HKO Pressure Collector

on:
  # 1. 支援來自 cron-job.org 的外部 Webhook 觸發
  repository_dispatch:
    types: [trigger-fetch]

  # 2. 保留原生的 GitHub schedule (當作雙重保險)
  schedule:
    - cron: '*/15 * * * *'

  # 3. 保留手動觸發按鈕
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: run: pip install requests firebase-admin
        
      - name: Run collector script
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: python fetch_data.py
